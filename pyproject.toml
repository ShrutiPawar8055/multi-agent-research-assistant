[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchcrew"
version = "0.1.0"
description = "A small multi-agent research assistant: planner, parallel researcher, writer and a grounding critic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shruti Pawar" }]
dependencies = []  # core pipeline is standard-library only

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
researchcrew = "researchcrew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
